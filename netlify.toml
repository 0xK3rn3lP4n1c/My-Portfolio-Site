[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    # The full CSP is emitted per-page as a <meta> by Astro (experimental.csp), which
    # auto-hashes inline scripts/styles. `frame-ancestors` is invalid in a <meta> CSP,
    # so it must be delivered here as a header (backed up by X-Frame-Options above).
    Content-Security-Policy = "frame-ancestors 'none'"

# Long-cache fingerprinted assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hidden "fuzz-only" pages (the OT lab, its debrief, and the decoy). These already carry a
# `noindex` <meta> and are excluded from the sitemap; the X-Robots-Tag header is defence in
# depth so a search engine that somehow reaches them still won't index them. They stay fully
# reachable — the point is discovery by recon, just never via search.
[[headers]]
  for = "/backup/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/substation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
